<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>圖片 → Base64 — 多功能轉換工具</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../assets/styles.css">
</head>
<body data-tool="image">
<div class="container">
  <div class="topbar">
    <div>
      <h2>多功能轉換工具</h2>
      <p>Base64、QR、SVG 與文字轉換，一頁完成</p>
    </div>
    <div class="badge">Utility Suite</div>
  </div>
  <div class="app-shell">
    <aside class="side-nav" id="sidebar"></aside>
    <section class="content-pane">
      <div class="tool active">
        <p class="muted">拖曳或選取圖片後，立即轉為 Base64。</p>
        <div id="dropZone" class="drop-zone">
          拖曳圖片到這裡，或點擊選擇圖片
          <input type="file" id="fileInput" accept="image/*" hidden>
        </div>
        <textarea id="base64Output" placeholder="Base64 會顯示在這裡"></textarea>
        <button onclick="copyBase64()">複製 Base64</button>
        <img id="preview" class="preview">
      </div>
    </section>
  </div>
</div>
<script src="../assets/nav.js"></script>
<script src="../assets/image.js"></script>
</body>
</html>
